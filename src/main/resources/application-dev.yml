  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
#        dialect: org.hibernate.dialect.MySQLDialect
        format-sql: true
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

logging:
  level:
    org.springframework.security: DEBUG



security:
  jwt:
    secret: ${JWT_SECRET:8jyjuOqzklROivpmqMVwGtN1MNUUQqkkTMJFI8xt7Ya}
    issuer: ${JWT_ISSUER:api.auth.com}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshTokenData}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
    cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}